<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change your booking · Overlap</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗓️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{BASE}}/style.css">
</head>
<body>
  <main class="wrap narrow">
    <section class="card"><span class="tape" aria-hidden="true"></span><div id="view"><p class="loading">Loading</p></div></section>
  </main>
  <script src="{{BASE}}/ui.js"></script>
  <script>
  (async () => {
    const view = document.getElementById('view');
    const t = new URLSearchParams(location.search).get('t') || '';
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const b = await api(`/api/public/booking?t=${encodeURIComponent(t)}`);
    if (b._status !== 200 || b.error) {
      view.innerHTML = '<h1>Booking not found</h1><p class="lede">Check the link in your calendar invite.</p>';
      return;
    }
    const when = `${fmtDay(b.start, tz)}, ${fmtTime(b.start, tz)} – ${fmtTime(b.end, tz)}`;
    const rebook = `${BASE}/${encodeURIComponent(b.slug)}#${b.duration}`;
    const head = `<p class="when">${esc(b.title)}</p><p class="muted">${esc(when)} (${esc(tz.replaceAll('_', ' '))})</p>`;
    if (b.cancelled) {
      view.innerHTML = `<h1>Cancelled</h1>${head}<p>This meeting is cancelled.</p><p><a class="btn green" href="${rebook}">Book a new time</a></p>`;
      return;
    }
    if (b.past) {
      view.innerHTML = `<h1>Already happened</h1>${head}<p>This meeting is in the past, so there's nothing to change.</p>`;
      return;
    }
    view.innerHTML = `
      <h1>Change your booking</h1>${head}
      <p id="err" class="error" hidden></p>
      <div class="chips">
        <button class="btn yellow" data-go="move">Cancel and pick a new time</button>
        <button class="btn pink" data-go="cancel">Just cancel it</button>
      </div>
      <p class="muted small">Everyone invited gets a cancellation from Google Calendar.</p>`;
    view.addEventListener('click', async (e) => {
      const go = e.target.closest('button')?.dataset.go;
      if (!go) return;
      view.querySelectorAll('button').forEach((x) => (x.disabled = true));
      const r = await api('/api/public/cancel', { method: 'POST', body: { t } });
      if (!r.ok) {
        const err = document.getElementById('err');
        err.textContent = r.message || 'Something went wrong. Please try again, or reply to the calendar invite.';
        err.hidden = false;
        view.querySelectorAll('button').forEach((x) => (x.disabled = false));
        return;
      }
      if (go === 'move') location.href = rebook;
      else view.innerHTML = `<div class="done-mark" aria-hidden="true">✓</div><h1>Cancelled</h1>${head}<p>Everyone's been told.</p><p><a class="btn" href="${rebook}">Book a new time</a></p>`;
    });
  })();
  </script>
</body>
</html>
