<!doctype html>
<!-- Source for public/og.png, the link-preview picture (Slack, WhatsApp, LinkedIn...).
     Re-render with: node scripts/og-image.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #22190f; --muted: #5e5043; --faint: #9a8b7a; --bg: #fff6e8;
    --green: #d3f0d6; --green-edge: #8fcf98; --tape: rgba(255, 210, 90, 0.8); --line: rgba(34, 25, 15, 0.12);
  }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background-color: var(--bg);
    background-image: radial-gradient(rgba(34, 25, 15, 0.13) 1.6px, transparent 1.9px);
    background-size: 30px 30px;
    font-family: "Bricolage Grotesque", sans-serif; color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .words { position: absolute; left: 84px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  h1 { margin: 0 0 26px; font-weight: 800; font-size: 118px; line-height: 0.9; letter-spacing: -0.045em; }
  p { margin: 0; font-size: 36px; line-height: 1.2; color: var(--muted); font-weight: 600; letter-spacing: -0.01em; }
  .brand { position: absolute; left: 84px; bottom: 52px; font-size: 26px; font-weight: 700; color: var(--faint); letter-spacing: -0.01em; }
  .brand span { margin-right: 8px; }

  .card {
    position: absolute; right: 84px; top: 70px; width: 440px; height: 490px;
    background: #fff; transform: rotate(2deg);
    box-shadow: 0 30px 60px rgba(70, 45, 10, 0.16), 0 3px 8px rgba(70, 45, 10, 0.1);
    padding: 34px 34px 0 34px; box-sizing: border-box;
  }
  .tape { position: absolute; top: -18px; left: 50%; width: 140px; height: 38px; transform: translateX(-50%) rotate(-4deg); background: var(--tape); }
  .day { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 18px; }
  .grid { position: relative; height: 380px; }
  .row { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--line); }
  .row b { position: absolute; left: 0; top: -14px; font-size: 19px; font-weight: 600; color: var(--faint); background: #fff; padding-right: 8px; }
  .band { position: absolute; left: 82px; right: 0; background: var(--green); border-left: 6px solid var(--green-edge); border-radius: 6px; }
  .pick {
    position: absolute; left: 92px; right: 12px; background: var(--ink); color: #fff; border-radius: 10px;
    font-size: 24px; font-weight: 700; display: flex; align-items: center; padding-left: 20px; letter-spacing: -0.01em;
    box-shadow: 0 8px 18px rgba(34, 25, 15, 0.25);
  }
</style>
</head>
<body>
  <div class="words">
    <h1>Book a time</h1>
    <p>Pick a time that works for everyone.</p>
  </div>
  <div class="brand"><span>🗓️</span>Calendfree</div>

  <div class="card">
    <span class="tape"></span>
    <div class="day">Thursday</div>
    <div class="grid">
      <!-- 76px an hour, 09:00 at the top -->
      <div class="row" style="top:0"><b>09:00</b></div>
      <div class="row" style="top:76px"><b>10:00</b></div>
      <div class="row" style="top:152px"><b>11:00</b></div>
      <div class="row" style="top:228px"><b>12:00</b></div>
      <div class="row" style="top:304px"><b>13:00</b></div>
      <div class="band" style="top:20px; height:94px"></div>
      <div class="band" style="top:190px; height:150px"></div>
      <div class="pick" style="top:228px; height:57px">12:00 – 12:45</div>
    </div>
  </div>
</body>
</html>
